name: CI

on:
  pull_request: ~
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        container:
          - "amaccis/node-libstemmer:22.22.3-3.1.0"
          - "amaccis/node-libstemmer:24.16.0-3.1.0"
          - "amaccis/node-libstemmer:26.3.0-3.1.0"

    container:
      image: ${{ matrix.container }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm run test
